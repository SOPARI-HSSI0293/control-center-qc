body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:#f3f7fd;color:#1f2a2e}
.btn{padding:.35rem .8rem;border-radius:.375rem;font-weight:500;font-size:.875rem;background:#2c7af2;color:#fff;display:inline-block;text-align:center}
.btn:hover{background:#1e63d6}.btn.g{background:#fff;color:#1f2a2e;border:1px solid #cfd6d3}.btn.g:hover{background:#eef1ef}.btn.r{background:#b91c1c}
.btn:disabled{opacity:.6}
.inp{width:100%;border:1px solid #cfd6d3;border-radius:.375rem;padding:.3rem .6rem;font-size:.875rem;background:#fff}
.inp:focus,.btn:focus-visible,.tab:focus-visible{outline:2px solid #2c7af2;outline-offset:1px}
.bd{display:inline-block;padding:.1rem .5rem;border-radius:.25rem;font-size:.75rem;font-weight:500}
.dot{width:.6rem;height:.6rem;border-radius:9999px;background:#d5dbd8}.dot.on{background:#2c7af2}.dot.now{background:#2c7af2;box-shadow:0 0 0 3px #a9cdfc}
.tab{padding:.4rem .9rem;font-size:.9rem;font-weight:500;color:#4b5a5f;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:#0f3a7d}.tab.on{color:#0f3a7d;border-color:#2c7af2;font-weight:600}
.stp{width:1.75rem;height:1.75rem;border-radius:9999px;display:grid;place-items:center;font-size:.75rem;font-weight:600;background:#e3e8e5;color:#5b676b}
.stp.on{background:#2c7af2;color:#fff}.stp.now{background:#2c7af2;color:#fff;box-shadow:0 0 0 4px #b9d6fd}

<body>
<div id="app"></div>
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/40 overflow-y-auto p-3 sm:p-8" onclick="if(event.target===this)closeM()"><div id="mbox" class="bg-white rounded-lg max-w-3xl mx-auto p-5 shadow-xl"></div></div>
<div id="corner" class="hidden fixed inset-0 z-[70] bg-black/60 p-2 sm:p-5"></div>
<div id="toast" class="hidden fixed bottom-4 right-4 z-[60] px-4 py-2 rounded bg-slate-800 text-white text-sm"></div>

<script>
/* ====== KONFIGURASI: tempel URL Web App Google Apps Script (berakhiran /exec) ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwqhBnwo4-FJmah_myNEgr8EEVYc8v06xDjJgoBoP7wJo8OHtqzPpDoy1R7moceNyDd/exec';
const APP_NAME = 'Control Center QC';
const TABS = [['CPAR', 'CPAR'], ['CLAIM/COMPLAINT', 'Claim / Complaint'], ['NG PROSES/DELIVERY', 'NG Proses / Delivery'], ['PROJECT', 'Project']];
const GUEST_TABS = ['CPAR', 'ISSUE'];
const RTAB = 'ROUTINE', ITAB = 'ISSUE', ALLTABS = [...TABS, [RTAB, 'Routine Job'], [ITAB, 'Quality Issue']];
const MON = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const PAL = [['#e8f0fb','#b3cdee'],['#e1f3f1','#a5d6d0'],['#fdf4df','#ecd08a'],['#f0ebf8','#cbbbe6'],['#d8eedf','#8ccaa0']];
const CC = {green: 'bg-emerald-100 text-emerald-800', red: 'bg-red-100 text-red-800', amber: 'bg-amber-100 text-amber-800'};
const PC = {High: 'bg-red-100 text-red-800', Medium: 'bg-amber-100 text-amber-800', Low: 'bg-slate-100 text-slate-700'};
const emptyF = () => ({q: '', s: '', p: '', o: '', d1: '', d2: ''});
let U = JSON.parse(sessionStorage.getItem('ctl_u') || 'null'), D = null, F = emptyF();
let TAB = sessionStorage.getItem('ctl_tab'); if (!ALLTABS.some(t => t[0] === TAB)) TAB = TABS[0][0];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dshort = s => { if (!s) return '-'; const d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? s : d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const isA = () => U.role === 'Admin';
const steps = r => D.cats[r.kategori].steps;
const idx = r => steps(r).findIndex(s => s.k === r.status_progress);
const closed = r => idx(r) === steps(r).length - 1;
const lbl = r => (steps(r)[idx(r)] || {}).l || r.status_progress;
const canMove = r => U.role !== 'Guest' && (isA() || U.role === 'QC' || U.nama === r.pic);
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 3000); }
function openM(h) { $('#mbox').innerHTML = h; $('#modal').classList.remove('hidden'); }
function closeM() { $('#modal').classList.add('hidden'); }

async function api(action, data = {}, auth = U && (U.role === 'Guest' ? {guest: true, nama: U.nama} : {username: U.username, password: U.password})) {
  if (API_URL.startsWith('PASTE')) throw new Error('API_URL belum diisi di index.html');
  const r = await fetch(API_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({action, auth, ...data})});
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan'); return j;
}
async function run(fn, btn) {
  if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = 'Memproses…'; }
  try { await fn(); } catch (e) { toast(e.message); } finally { if (btn) { btn.disabled = false; btn.textContent = btn.dataset.t; } }
}
function readFile(f) {
  return new Promise((res, rej) => {
    if (!/\.(pdf|jpe?g|png)$/i.test(f.name)) return rej(new Error('Format file harus .pdf, .jpg, .jpeg, atau .png'));
    if (f.size > 5 * 1024 * 1024) return rej(new Error('Ukuran file maksimal 5 MB'));
    const fr = new FileReader();

  <div class="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-8 gap-x-4 gap-y-3 text-sm">
  ${kv('Customer / Pihak Terkait', r.customer)}${kv('No. Referensi', r.ref_no)}${kv('PIC', r.pic)}${kv('Status', lbl(r))}${kv('Tanggal Dibuat', dshort(r.tanggal))}${kv('Target', dshort(r.target_date))}${kv('Tanggal Close', dshort(r.tgl_close))}${kv('Terakhir Update', dshort(r.last_updated))}</div>
  <div class="text-sm mt-3 pt-3 border-t"><div class="text-xs text-slate-500">Deskripsi</div><p class="whitespace-pre-wrap">${esc(r.deskripsi) || '-'}</p></div></section>
  <section class="bg-white rounded-lg border border-slate-200 p-4 w-full"><h3 class="font-semibold">Timeline Progress</h3><p class="text-xs text-slate-500 mb-4">Dokumen hanya bisa ditambah pada aktivitas terakhir. Setelah tahap berikutnya diproses, dokumen terkunci.</p>
  <ol class="relative border-l-2 border-slate-200 ml-1.5 space-y-4">${tl}</ol></section>
    <section class="bg-white rounded-lg border border-slate-200 p-4"><h3 class="font-semibold mb-3">Update Progress</h3>
  ${can ? `<div class="space-y-3"><div class="grid md:grid-cols-3 gap-3 items-end">
  <label class="text-xs text-slate-500">Aksi<select id="ut" class="inp">${opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select></label>
  <label class="text-xs text-slate-500">Target date<input id="ud" type="date" class="inp" value="${esc(r.target_date)}"></label>
  <label class="text-xs text-slate-500">Dokumen (maks 5 file, 5 MB; PDF/JPG/PNG)<input id="uf" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" class="inp"></label></div>
  <textarea id="un" class="inp" rows="2" placeholder="Catatan (wajib jika status dikembalikan)"></textarea>
  <div class="flex flex-wrap gap-2 justify-between">${isA() ? `<div class="flex gap-2"><button class="btn g" onclick="recForm('${id}')">Edit Data</button><button class="btn r" onclick="delRec('${id}')">Hapus</button></div>` : '<span></span>'}<button class="btn" id="ub">Simpan progress</button></div></div>`
  : `<p class="text-sm text-slate-500">Hanya QC, Admin, atau PIC record ini yang dapat memperbarui progress.</p>${isA() ? `<div class="flex gap-2 mt-3"><button class="btn g" onclick="recForm('${id}')">Edit Data</button><button class="btn r" onclick="delRec('${id}')">Hapus</button></div>` : ''}`}</section>
</main>` + footer();
  if (can) $('#ub').onclick = e => run(async () => {
    const to = $('#ut').value, d = $('#ud').value;
    await api('updateProgress', {record_id: id, to, target_date: d, notes: $('#un').value, files: await readFiles($('#uf'))});
    toast('Progress diperbarui'); await loadData();
  }, e.target);
}
function addDocs(id, log_id, inp) {
  run(async () => { const files = await readFiles(inp); if (!files.length) return; toast('Mengunggah…'); await api('addDocs', {record_id: id, log_id, files}); await loadData(); toast('Dokumen tersimpan'); });
}
function delRec(id) { if (confirm('Hapus ' + id + '? Tindakan ini tidak bisa dibatalkan.')) run(async () => { await api('adminAction', {op: 'deleteRecord', record_id: id}); location.hash = ''; await loadData(); toast('Record dihapus'); }); }

/* ---------- Buat / Edit ---------- */
function recForm(id) {
  const r = id ? D.records.find(x => x.record_id === id) : {};
  openM(`<h2 class="text-lg font-semibold mb-3">${id ? 'Edit ' + id : 'Buat Baru'}</h2><div class="space-y-2">
  ${id ? '' : `<select id="rk" class="inp">${TABS.map(t => `<option value="${t[0]}" ${t[0] === TAB ? 'selected' : ''}>${t[1]}</option>`).join('')}</select>`}
  <div class="grid sm:grid-cols-2 gap-2"><input id="rc" class="inp" placeholder="Customer / pihak terkait" value="${esc(r.customer)}"><input id="rr" class="inp" placeholder="No. referensi (No. CPAR / claim / PO / project)" value="${esc(r.ref_no)}"></div>
  <input id="rj" class="inp" placeholder="Judul / subjek masalah" value="${esc(r.judul)}">
  <textarea id="rd" class="inp" rows="4" placeholder="Deskripsi">${esc(r.deskripsi)}</textarea>
  <div class="grid sm:grid-cols-3 gap-2"><label class="text-xs text-slate-500">Prioritas<select id="rp" class="inp">${['Medium', 'High', 'Low'].map(x => `<option ${r.prioritas === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
  <label class="text-xs text-slate-500">Target date<input id="rt" type="date" class="inp" value="${esc(r.target_date)}"></label>
  ${isA() ? `<label class="text-xs text-slate-500">PIC<input id="rpic" class="inp" value="${esc(r.pic || U.nama)}"></label>` : ''}</div>
  ${id ? '' : '<input id="rf" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" class="inp"><p class="text-xs text-slate-500">Lampiran awal (opsional), maks 5 file, 5 MB per file.</p>'}
  <div class="flex gap-2 justify-end"><button class="btn g" onclick="closeM()">Batal</button><button class="btn" id="rs">${id ? 'Simpan perubahan' : 'Simpan'}</button></div></div>`);
  $('#rs').onclick = e => run(async () => {
    const d = {customer: $('#rc').value.trim(), ref_no: $('#rr').value.trim(), judul: $('#rj').value.trim(), deskripsi: $('#rd').value, prioritas: $('#rp').value, target_date: $('#rt').value, pic: $('#rpic') && $('#rpic').value.trim()};
    if (!d.customer || !d.judul) throw new Error('Customer dan judul wajib diisi');
    if (!d.target_date) throw new Error('Target date wajib diisi');
    if (id) { await api('adminAction', {op: 'editRecord', record_id: id, data: d, notes: 'Data diedit'}); }
    else { d.kategori = $('#rk').value; const j = await api('createRecord', {...d, files: await readFiles($('#rf'))}); TAB = d.kategori; sessionStorage.setItem('ctl_tab', TAB); }
    closeM(); await loadData(); toast(id ? 'Perubahan disimpan' : 'Data dibuat');
  }, e.target);
}

/* ---------- Admin: Users & Settings ---------- */
async function adminPanel() {
  const {users} = await api('adminAction', {op: 'listUsers'}), s = D.settings;
  openM(`<div class="flex justify-between mb-3"><h2 class="text-lg font-semibold">Pengaturan / Users</h2><button class="btn g" onclick="closeM()">Tutup</button></div>
  <h3 class="font-semibold mb-2">Parameter</h3><div class="grid sm:grid-cols-2 gap-2 mb-2">
  <label class="text-sm">Peringatan jatuh tempo (hari sebelum target)<input id="s1" type="number" min="0" class="inp" value="${s.due_soon_days}"></label>
  <label class="text-sm">ID Folder Google Drive<input id="s2" class="inp" value="${esc(s.drive_folder_id)}"></label></div>
  <button class="btn mt-1 mb-5" id="ss">Simpan pengaturan</button>
  <h3 class="font-semibold mb-2">Akun Pengguna</h3><div class="overflow-x-auto mb-3"><table class="w-full text-sm"><tbody>${users.map(u => `<tr class="border-b"><td class="py-1">${esc(u.nama)}<div class="text-xs text-slate-500">${esc(u.username)}</div></td><td>${esc(u.role)}</td><td>${esc(u.status)}</td>
  <td class="text-right"><button class="btn g" onclick='userForm(${JSON.stringify(u).replace(/'/g, '&#39;')})'>Edit</button> <button class="btn r" onclick="delUser('${u.user_id}')">Hapus</button></td></tr>`).join('')}</tbody></table></div>
  <div id="uform"></div><button class="btn g" onclick="userForm({})">+ Tambah user</button>`);
  $('#ss').onclick = e => run(async () => {
    await api('adminAction', {op: 'saveSettings', data: {due_soon_days: +$('#s1').value, drive_folder_id: $('#s2').value.trim()}});
    await loadData(); toast('Pengaturan disimpan');
  }, e.target);
}
function userForm(u) {
  $('#uform').innerHTML = `<div class="border rounded p-3 mb-3 grid sm:grid-cols-2 gap-2"><input id="un1" class="inp" placeholder="Nama" value="${esc(u.nama)}"><input id="un2" class="inp" placeholder="Username" value="${esc(u.username)}">
  <input id="un3" class="inp" placeholder="${u.user_id ? 'Password baru (kosongkan jika tidak diubah)' : 'Password'}"><select id="un4" class="inp">${['Staff', 'QC', 'Admin'].map(x => `<option ${u.role === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
  <select id="un5" class="inp"><option>Active</option><option ${u.status === 'Inactive' ? 'selected' : ''}>Inactive</option></select><button class="btn" id="usv">Simpan user</button></div>`;
  $('#usv').onclick = e => run(async () => {
    await api('adminAction', {op: 'saveUser', data: {user_id: u.user_id || '', nama: $('#un1').value.trim(), username: $('#un2').value, password: $('#un3').value, role: $('#un4').value, status: $('#un5').value}});
    toast('User disimpan'); adminPanel();
  }, e.target);
}
function delUser(id) { if (confirm('Hapus user ini?')) run(async () => { await api('adminAction', {op: 'deleteUser', user_id: id}); toast('User dihapus'); adminPanel(); }); }

render();
initCorner();
</script>
</body>
</html>
